<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saurabh Singh — Portfolio</title>
<meta name="description" content="Saurabh Singh — Machine Learning Engineer. PyTorch, TensorFlow, LangChain, AWS, Kubernetes.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Inter is a fallback for platforms without Helvetica Neue (Netflix's real
     font stack). On Mac/iOS the --font var below resolves to true Helvetica
     Neue and this webfont never even loads visibly. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- ?v= is a cache-buster. Browsers and the GitHub Pages CDN cache CSS/JS
     aggressively, so an edit can appear to "not deploy". Bump this number
     whenever a change doesn't show up after pushing. -->
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<!-- ============================================================ INTRO -->
<div id="intro" class="intro">
  <div class="intro-inner">
    <!-- strand layer: same wordmark, filled with vertical filaments of light -->
    <div class="intro-strandtext" id="introStrandText" aria-hidden="true"></div>
    <!-- solid layer: resolves in as the strands finish their sweep -->
    <h1 class="intro-name" id="introName" aria-label="Saurabh"></h1>
  </div>
  <div class="intro-vignette"></div>
</div>

<!-- ===================================================== PROFILE GATE -->
<section id="gate" class="gate" hidden>
  <header class="gate-top"><span class="logo" id="gateLogo"></span></header>
  <div class="gate-body">
    <h2 class="gate-title">Who's watching?</h2>
    <ul class="gate-list" id="gateList"></ul>
    <p class="gate-hint">Pick a profile — each one tells the story differently.</p>
  </div>
</section>

<!-- ============================================================== APP -->
<div id="app" class="app" hidden>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar" aria-label="Main">
    <ul>
      <li><a href="#home"         data-nav="home">        <span class="ic" data-i="home"></span><span class="lb">Home</span></a></li>
      <li><a href="#professional" data-nav="professional"><span class="ic" data-i="work"></span><span class="lb">Professional</span></a></li>
      <li><a href="#skills"       data-nav="skills">      <span class="ic" data-i="skills"></span><span class="lb">Skills</span></a></li>
      <li><a href="#projects"     data-nav="projects">    <span class="ic" data-i="code"></span><span class="lb">Projects</span></a></li>
      <li><a href="#hire"         data-nav="hire">        <span class="ic" data-i="mail"></span><span class="lb">Hire Me</span></a></li>
    </ul>

    <div class="sidebar-foot">
      <div class="sidebar-div"></div>
      <button class="sidebar-profile" id="sidebarSwitch" title="Switch profile">
        <span class="av" id="sidebarAvatar"></span>
        <span class="sp-text lb">
          <em id="sidebarProfileName"></em>
          Switch Profiles
        </span>
        <span class="ic sp-chev lb" data-i="chev"></span>
      </button>
    </div>
  </nav>

  <!-- Top bar — mark only; profile switching lives in the sidebar -->
  <header class="topbar" id="topbar">
    <span class="logo" id="appLogo"></span>
  </header>

  <main>
    <!-- ------------------------------------------------------- HERO -->
    <section class="hero" id="home">
      <div class="hero-media">
        <div class="hero-video" id="heroVideo"></div>
        <div class="hero-poster" id="heroPoster"></div>
        <div class="scrim scrim-top"></div>
        <div class="scrim scrim-left"></div>
        <div class="scrim scrim-bottom"></div>
      </div>

      <div class="hero-content">
        <p class="hero-kicker" id="heroKicker"><span class="n-mark">S</span> S E R I E S</p>
        <h1 class="hero-title" id="heroTitle"></h1>
        <!-- everything below the title fades out together on scroll,
             leaving the shrinking title behind — same as Netflix -->
        <div class="hero-sub" id="heroSub">
          <p class="hero-tagline" id="heroTagline"></p>
          <div class="hero-meta" id="heroMeta"></div>
          <p class="hero-desc" id="heroDesc"></p>
          <div class="hero-actions">
            <a class="btn btn-play" id="btnResume" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l16 9-16 9V3z"/></svg>
              Resume
            </a>
            <button class="btn btn-info" id="btnMore">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
              More Info
            </button>
          </div>
        </div>
      </div>

      <div class="hero-controls">
        <button class="circ" id="btnSound" title="Toggle sound" aria-label="Toggle sound"></button>
        <button class="circ" id="btnReplay" title="Replay" aria-label="Replay">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 11-6 6H4a8 8 0 108-8z"/></svg>
        </button>
        <span class="age-badge">18+</span>
      </div>
    </section>

    <!-- ------------------------------------------------------- ROWS -->
    <div class="rows" id="rows"></div>

    <!-- ------------------------------------------------------- HIRE -->
    <section class="hire" id="hire">
      <h2 class="row-title">Hire Me</h2>
      <div class="hire-card">
        <div class="hire-left">
          <h3 id="hireName"></h3>
          <p id="hireLine"></p>
          <div class="hire-actions" id="hireActions"></div>
        </div>
        <div class="hire-right" id="hireFacts"></div>
      </div>
    </section>

    <footer class="foot">
      <p id="footText"></p>
      <p class="foot-fine">Netflix-inspired fan design. Not affiliated with Netflix.</p>
    </footer>
  </main>
</div>

<!-- ============================================================ MODAL -->
<div class="modal-wrap" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-x" data-close aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </button>
    <div class="modal-hero" id="modalHero">
      <h2 id="modalTitle"></h2>
      <p id="modalSub"></p>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="js/data.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
